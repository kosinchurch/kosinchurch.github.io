# Supabase 무료 요금제는 7일 동안 아무도 접속하지 않으면 잠시 멈춥니다. 일주일에 두 번 가볍게 접속해서 멈추지 않게 합니다.
# (공개용 값만 사용합니다. 비밀 키는 쓰지 않습니다. 수동 실행: Actions 탭 > supabase-keepalive > Run workflow)
name: supabase-keepalive
on:
  schedule:
    - cron: '17 3 * * 1,4'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          URL="https://cefnsnrsphorsxprsrvp.supabase.co"
          KEY="sb_publishable_NmTePyAnZXqNL4aZQN3FOA_qp6-eld0"
          a=$(curl -s -o /dev/null -w "%{http_code}" "$URL/auth/v1/health" -H "apikey: $KEY")
          b=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/user_progress?select=kind&limit=1" -H "apikey: $KEY")
          echo "auth health: $a, rest: $b"
          test "$a" = "200"